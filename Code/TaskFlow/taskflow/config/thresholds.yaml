weights:                       # sum to 1.0 — quality signals only, no safety signals
  citation_coverage: 0.35
  grounding_entailment: 0.25
  retrieval_relevance: 0.20
  intent_confidence: 0.10
  tone_alignment: 0.10

thresholds:                    # per-intent auto-send bar
  general: 0.70
  technical: 0.70
  account: 0.70
  feature_request: 0.75
  billing: 0.80
  refund: 0.90
  complaint: 1.01              # unreachable by construction; also blocked by G4
  unknown: 1.01

gates:
  abstain_threshold: 0.55
  min_grounding_ratio: 0.80
  max_unsupported_claims: 0

# Confidence assigned by the deterministic keyword classifier when the LLM path is
# unavailable. These are deliberately at or below the G5 abstain threshold for every
# intent whose keywords are weak evidence: a keyword match is not a classification.
fallback_confidences:
  complaint: 0.80        # unambiguous language; G4 blocks the intent anyway
  refund: 0.70
  billing: 0.65
  account: 0.65
  technical: 0.60
  feature_request: 0.55
  unknown: 0.40
  draft: 0.50            # confidence stamped on the template fallback draft

# Tone alignment signal (services/confidence/tone.py). Warning-severity policy
# violations reduce the tone score; they never block on their own.
tone:
  warning_penalty: 0.25          # subtracted per warning-severity policy violation
  intent_mismatch_penalty: 0.30  # subtracted when an upset intent gets a non-acknowledging tone

citation_validation_threshold: 0.70

# Retrieval sufficiency. These are thresholds on the reranker's calibrated relevance
# (0-1), not on the fusion rank score — RRF only encodes rank position, so a threshold
# on it could not tell a strong match from a weak one. Sizing knobs (prefetch_k,
# rerank_k, model names) live in settings.yaml; only the decision boundaries live here.
retrieval:
  min_top_score: 0.55       # the best chunk must clear this to count as an answer
  min_support_score: 0.20   # a chunk at or above this counts toward support
  min_support_count: 2

sla_minutes: {default: 120, complaint: 60, refund: 60}
validator_timeout_s: 15
